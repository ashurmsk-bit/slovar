<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Словарь">
<link rel="apple-touch-icon" href="slovar-icon.png">
<link rel="manifest" href="slovar-manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<title>Мой словарь</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b6b5c'/%3E%3Ctext x='50' y='72' font-size='64' font-weight='700' text-anchor='middle' fill='white' font-family='sans-serif'%3E%D0%A1%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#14231f;--mute:#66767a;--line:#d9e3e0;--ac:#0b6b5c;--ac2:#e3f1ee;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0f1715;--card:#18221f;--ink:#e8f1ee;--mute:#8da09b;--line:#2a3733;--ac:#3fb8a3;--ac2:#1c2e2a;--bad:#f2928b}}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;border-bottom:1px solid var(--line)}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:1.15rem;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h1 small{font-weight:400;color:var(--mute);font-size:.8rem}
.add{display:grid;grid-template-columns:1fr 1fr 52px;gap:8px}
#addBtn{padding:0;font-size:1.9rem;line-height:1;width:52px}
input{font:inherit;padding:.7rem .8rem;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-width:0;width:100%}
input:focus{outline:2px solid var(--ac);border-color:var(--ac)}
button{font:inherit;border:0;border-radius:10px;padding:.7rem 1rem;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.ghost{background:var(--ac2);color:var(--ac)}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#q{margin-top:8px}
main{padding:12px}
.row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem .8rem;margin-bottom:8px}
.row b{overflow-wrap:anywhere}.row span{color:var(--mute);overflow-wrap:anywhere}
.acts{display:flex;gap:6px}
.acts button{padding:.5rem .7rem;min-width:2.6rem}
.del{background:transparent;color:var(--bad);border:1.5px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.note{background:var(--ac2);color:var(--ink);border-radius:12px;padding:.7rem .9rem;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.empty{color:var(--mute);text-align:center;padding:2rem 1rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--ink);color:var(--bg);padding:.7rem 1rem;border-radius:12px;display:none;gap:12px;align-items:center;z-index:9;max-width:92vw}
#toast button{background:transparent;color:var(--bg);text-decoration:underline;padding:0 .3rem}
@media(max-width:520px){.row{grid-template-columns:1fr auto}.row span{grid-column:1;grid-row:2}.acts{grid-row:1/3;grid-column:2}}

html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
input{-webkit-appearance:none;appearance:none;border-radius:10px}
input,button{min-height:48px}
.acts button{min-height:44px;min-width:44px}
.top{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
main{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));padding-bottom:calc(env(safe-area-inset-bottom,0px) + 90px)}
.row,.row *{-webkit-user-select:text;user-select:text}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:8;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.panel{background:var(--card);width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);display:grid;gap:10px}
.panel h2{font-size:1rem;margin:6px 0 0;color:var(--mute);font-weight:600}
.panel .close{background:transparent;color:var(--mute);border:1.5px solid var(--line);margin-top:6px}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <h1>Мой словарь <small id="cnt"></small></h1>
  <div class="add">
    <input id="w" placeholder="Слово" autocomplete="off" autocapitalize="none" enterkeyhint="next">
    <input id="t" placeholder="Перевод" autocomplete="off" autocapitalize="none" enterkeyhint="done">
    <button id="addBtn" aria-label="Добавить слово">+</button>
  </div>
  <input id="q" type="search" placeholder="Поиск по слову или переводу" autocomplete="off">
</div></div>
<main><div class="wrap">
  <div id="remind"></div>
  <div class="bar"><button class="ghost" id="ei">Экспорт / импорт</button></div>
  <div id="list"></div>
</div></main>
<div id="sheet" hidden>
  <div class="panel" role="dialog" aria-label="Экспорт и импорт">
    <h2>Экспорт</h2>
    <button class="ghost" data-x="xl">Для Excel (CSV)</button>
    <button class="ghost" data-x="gs">Для Google Таблиц (CSV)</button>
    <button class="ghost" data-x="json">JSON</button>
    <h2>Импорт</h2>
    <button class="ghost" id="imp">Загрузить файл CSV или JSON</button>
    <input type="file" id="file" accept=".csv,.json,text/csv,application/json,text/plain" hidden>
    <button class="close" id="sheetClose">Закрыть</button>
  </div>
</div>
<div id="toast"><span id="tmsg"></span><button id="undo">Отменить</button></div>
<script>
const MAX=10000, KEY='slovar.words', KB='slovar.lastBackup';
const $=id=>document.getElementById(id);
let words=[], editId=null, shown=100, undoFn=null, tt;

function load(){try{words=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){words=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(words))}catch(e){toast('Не удалось сохранить: память браузера заполнена',0)}}
function toast(msg,canUndo,fn){
  $('tmsg').textContent=msg;$('undo').style.display=canUndo?'':'none';undoFn=fn||null;
  $('toast').style.display='flex';clearTimeout(tt);tt=setTimeout(()=>$('toast').style.display='none',canUndo?7000:3500);
}
$('undo').onclick=()=>{if(undoFn)undoFn();$('toast').style.display='none'};

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const norm=v=>v.toLowerCase().replace(/ё/g,'е');
function search(q){
  const toks=norm(q).split(/\s+/).filter(Boolean);
  const res=[];
  for(const x of words){
    const fields=[norm(x.w),norm(x.t)];
    let total=0;
    for(const tk of toks){
      let best=0;
      for(const f of fields){
        if(f===tk)best=Math.max(best,3);
        else if(f.startsWith(tk))best=Math.max(best,2);
        else if(f.split(/[^\p{L}\p{N}]+/u).some(w=>w.startsWith(tk)))best=Math.max(best,1);
      }
      if(!best){total=0;break}
      total+=best;
    }
    if(total)res.push([total,x]);
  }
  return res.map((r,i)=>[r[0],i,r[1]]).sort((a,b)=>b[0]-a[0]||a[1]-b[1]).map(r=>r[2]);
}
function render(){
  const q=$('q').value.trim().toLowerCase();
  const f=q?search(q):words;
  $('cnt').textContent=words.length.toLocaleString('ru');
  if(!f.length){$('list').innerHTML='<div class="empty">'+(words.length?'Ничего не найдено':'Словарь пуст. Введите слово и перевод вверху.')+'</div>';return}
  const part=f.slice(0,shown);
  let h=part.map(x=>`<div class="row"><b>${esc(x.w)}</b><span>${esc(x.t)}</span><div class="acts"><button class="ghost" data-e="${x.id}" aria-label="Изменить">✎</button><button class="del" data-d="${x.id}" aria-label="Удалить">✕</button></div></div>`).join('');
  if(f.length>shown)h+=`<button class="ghost" id="more" style="width:100%">Показать ещё (${f.length-shown})</button>`;
  $('list').innerHTML=h;
}
function add(){
  const w=$('w').value.trim(), t=$('t').value.trim();
  if(!w||!t){toast('Заполните слово и перевод',0);(w?$('t'):$('w')).focus();return}
  if(editId){
    const x=words.find(a=>a.id===editId);if(x){x.w=w;x.t=t}
    editId=null;$('addBtn').textContent='+';
  }else{
    if(words.length>=MAX){toast('Достигнут предел: '+MAX+' слов',0);return}
    if(words.some(a=>a.w.toLowerCase()===w.toLowerCase())&&!confirm('Слово «'+w+'» уже есть. Добавить ещё раз?'))return;
    words.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),w,t});
  }
  save();$('w').value='';$('t').value='';$('w').focus();render();
}
$('addBtn').onclick=add;
$('w').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('t').focus()}});
$('t').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}});
$('q').addEventListener('input',()=>{shown=100;render()});
$('list').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='more'){shown+=200;render();return}
  if(b.dataset.e){const x=words.find(a=>a.id===b.dataset.e);if(!x)return;editId=x.id;$('w').value=x.w;$('t').value=x.t;$('addBtn').textContent='✓';$('w').focus();scrollTo({top:0,behavior:'smooth'})}
  if(b.dataset.d){
    const i=words.findIndex(a=>a.id===b.dataset.d);if(i<0)return;
    const [x]=words.splice(i,1);save();render();
    toast('Слово удалено',1,()=>{words.splice(Math.min(i,words.length),0,x);save();render()});
  }
});

// Экспорт
function csv(sep){
  const q=s=>'"'+s.replace(/"/g,'""')+'"';
  const rows=[['Слово','Перевод'],...words.slice().reverse().map(x=>[x.w,x.t])];
  return '\ufeff'+rows.map(r=>r.map(q).join(sep)).join('\r\n');
}
function download(fmt){
  if(!words.length){toast('Словарь пуст',0);return}
  const ordered=words.slice().reverse();
  let text,type,name;
  if(fmt==='json'){text=JSON.stringify(ordered.map(x=>({word:x.w,translation:x.t})),null,1);type='application/json';name='slovar.json'}
  else{text=csv(fmt==='gs'?',':';');type='text/csv;charset=utf-8';name=fmt==='gs'?'slovar-google.csv':'slovar-excel.csv'}
  const blob=new Blob([text],{type});
  const done=()=>{try{localStorage.setItem(KB,String(Date.now()))}catch(e){}remind();toast('Файл готов',0)};
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const file=new File([blob],name,{type:type.split(';')[0]});
  if(ios&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:name}).then(done).catch(()=>{});
    return;
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  done();
}
const sheet=$('sheet');
$('ei').onclick=()=>{sheet.hidden=false};
$('sheetClose').onclick=()=>{sheet.hidden=true};
sheet.addEventListener('click',e=>{
  if(e.target===sheet){sheet.hidden=true;return}
  const b=e.target.closest('[data-x]');if(b){sheet.hidden=true;download(b.dataset.x)}
});

// Импорт
function parseCSV(text){
  text=text.replace(/^\ufeff/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const sep=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',';
  const out=[];let row=[],cur='',inq=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inq){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else inq=false}else cur+=c}
    else if(c==='"')inq=true;
    else if(c===sep){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';out.push(row);row=[]}
    else cur+=c;
  }
  if(cur||row.length){row.push(cur);out.push(row)}
  return out;
}
function addWords(list){
  const have=new Set(words.map(x=>x.w.toLowerCase()+'|'+x.t.toLowerCase()));
  let n=0;
  for(const [w,t] of list){
    if(words.length>=MAX)break;
    const k=w.toLowerCase()+'|'+t.toLowerCase();
    if(have.has(k))continue;have.add(k);
    words.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),w,t});n++;
  }
  return n;
}
$('imp').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const text=await f.text();let list=[];
  try{
    if(/\.json$/i.test(f.name)||/^\s*[\[{]/.test(text)){
      let d=JSON.parse(text);if(!Array.isArray(d))d=d.words||[];
      list=d.map(x=>Array.isArray(x)?[x[0],x[1]]:[x.word??x.w??x['слово'],x.translation??x.t??x['перевод']]);
    }else{
      list=parseCSV(text).filter(r=>r.length>=2);
      if(list.length&&/^(слово|word)$/i.test((list[0][0]||'').trim()))list.shift();
    }
    list=list.map(r=>[String(r[0]??'').trim(),String(r[1]??'').trim()]).filter(r=>r[0]&&r[1]);
  }catch(err){toast('Не удалось прочитать файл',0);e.target.value='';return}
  const n=addWords(list);
  save();render();sheet.hidden=true;toast('Добавлено слов: '+n,0);e.target.value='';
};

// Напоминание о копии раз в неделю
function remind(){
  let last=0;try{last=+localStorage.getItem(KB)||0}catch(e){}
  const old=!last||Date.now()-last>7*864e5;
  $('remind').innerHTML=(old&&words.length)?'<div class="note"><span>Давно не было резервной копии. Скачайте файл, чтобы слова не пропали.</span><button id="bk">Скачать</button></div>':'';
  const b=$('bk');if(b)b.onclick=()=>download('xl');
}

// Работа без интернета
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  navigator.serviceWorker.register('slovar-sw.js').catch(()=>{});
}

load();render();remind();
</script>
</body>
</html>
